<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ollama Local Chat</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="brand">Ollama Local Chat</div>
          <button
            id="newChat"
            class="sidebar-command"
            title="Start a saved local chat"
          >
            ＋ New chat
          </button>
          <button
            id="privateChat"
            class="sidebar-command"
            title="Start a chat that is not saved"
          >
            ◇ Private chat <span>not saved</span>
          </button>
        </div>

        <div class="side-section-title">Chats</div>
        <div id="conversationList" class="conversation-list"></div>

        <div class="side-footer">
          <div>Local app: 127.0.0.1:8765</div>
          <div>Ollama: 127.0.0.1:11434</div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div></div>
          <button
            id="settingsToggle"
            class="ghost-button"
            title="Models and optional system prompt"
          >
            Settings
          </button>
        </header>

        <section id="settingsPanel" class="settings hidden">
          <label
            >Model
            <div class="model-row">
              <select id="modelSelect"></select>
              <input
                id="modelAdd"
                placeholder="add model name, e.g. llama3.2:latest"
              />
              <button id="addModel">Add</button>
            </div>
          </label>
          <label
            >Optional system prompt
            <textarea
              id="systemPrompt"
              rows="3"
              placeholder="Usually leave this empty."
            ></textarea>
          </label>
          <div id="modelWarning" class="warning hidden"></div>
        </section>

        <section id="messages" class="messages" aria-live="polite"></section>

        <form id="composer" class="composer">
          <div class="composer-shell">
            <textarea
              id="messageInput"
              rows="1"
              placeholder="Message Gemma locally..."
            ></textarea>
            <button
              id="sendButton"
              type="submit"
              aria-label="Send message"
              title="Send"
            >
              ↑
            </button>
          </div>
        </form>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
